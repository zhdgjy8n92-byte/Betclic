name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/betclic-mercatodds-site-wdurl5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # On ne publie que public/, qui ne contient que la version chiffrée.
      # Publier la racine exposerait le site en clair à côté du portail.
      - name: Vérifier que le site en clair n'est pas publié
        run: |
          test -f public/index.html
          if grep -q "MERCATODDS_RUMEURS" public/index.html; then
            echo "::error::Le contenu en clair a fuité dans public/index.html"
            exit 1
          fi
          echo "public/ ne contient que du chiffré."

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
